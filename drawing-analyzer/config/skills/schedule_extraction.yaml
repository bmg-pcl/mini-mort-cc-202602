# Schedule Extraction Analysis Skill
name: schedule_extraction
drawing_types:
  - schedule
  - table
  - tabular
  - equipment_schedule
disciplines:
  - all
  - architectural
  - mechanical
  - electrical
  - plumbing
description: Extracts data from tabular schedules on drawings
capabilities:
  - quantity_takeoff
  - notes_extraction
priority: 30
analysis_prompt: |
  Analyze this schedule/table region on the drawing.

  This skill handles various types of schedules including:
  - Door schedules
  - Window schedules
  - Room finish schedules
  - Equipment schedules
  - Fixture schedules
  - Panel schedules
  - Valve schedules
  - Instrument schedules

  Focus on extracting:

  1. TABLE STRUCTURE:
     - Column headers
     - Row identifiers (marks, tags, IDs)
     - Number of rows/entries

  2. COMMON SCHEDULE FIELDS:
     - Mark/Tag/ID number
     - Description/Type
     - Size/Dimensions
     - Quantity
     - Material
     - Finish
     - Manufacturer
     - Model number
     - Rating/Capacity
     - Notes/Remarks

  3. DOOR SCHEDULE SPECIFICS:
     - Door size (width x height)
     - Door type
     - Frame type
     - Hardware group
     - Fire rating
     - Undercut

  4. WINDOW SCHEDULE SPECIFICS:
     - Window size
     - Window type
     - Glazing type
     - Frame material
     - U-value/SHGC

  5. EQUIPMENT SCHEDULE SPECIFICS:
     - Equipment tag
     - Capacity/Rating
     - Electrical requirements
     - Utility connections
     - Manufacturer/Model

  6. FINISH SCHEDULE SPECIFICS:
     - Room number
     - Room name
     - Floor finish
     - Base
     - Wall finish
     - Ceiling finish
     - Ceiling height

  For each row/entry, extract:
  - All column values
  - Associated marks/tags
  - Notes and remarks

  Respond with JSON. Structure the output as an array of
  schedule entries with all captured fields.
