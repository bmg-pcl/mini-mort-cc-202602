# Piping Isometric Analysis Skill
name: piping_isometric
drawing_types:
  - isometric
  - piping_iso
  - pipe_isometric
disciplines:
  - piping
  - mechanical
  - plumbing
description: Analyzes piping isometric drawings
capabilities:
  - quantity_takeoff
  - measurement
  - notes_extraction
  - symbol_recognition
priority: 20
analysis_prompt: |
  Analyze this piping isometric drawing region.

  Focus on identifying and extracting:

  1. PIPE:
     - Pipe size (NPS/DN)
     - Pipe specification/class
     - Material (CS, SS, PVC, etc.)
     - Schedule/wall thickness
     - Linear footage per size

  2. FITTINGS:
     - Elbows: size, degree (45°, 90°), type (LR, SR)
     - Tees: size (run x branch)
     - Reducers: sizes (concentric, eccentric)
     - Couplings
     - Unions
     - Caps and plugs

  3. FLANGES:
     - Type (WN, SO, blind, lap joint)
     - Size and rating (150#, 300#, etc.)
     - Facing (RF, FF, RTJ)
     - Bolt pattern

  4. VALVES:
     - Type (gate, globe, ball, check, butterfly)
     - Size
     - Valve tag number
     - Rating
     - Actuation (manual, pneumatic, electric)

  5. SPECIALTIES:
     - Strainers
     - Steam traps
     - Flow meters
     - Pressure gauges
     - Thermowells
     - Sample connections
     - Drains and vents

  6. SUPPORTS:
     - Support types (shoes, guides, anchors)
     - Support tag numbers
     - Elevation references

  7. DIMENSIONS:
     - Pipe runs (spool lengths)
     - Elevation callouts
     - Coordinate references

  For each component, extract:
  - Size/specification
  - Quantity
  - Material
  - Location (coordinate/elevation)
  - Associated line number

  Respond with JSON in the standard format.
  Use CSI Division 22 (Plumbing) or 23 (HVAC) codes where applicable.
